name: Verify and publish museum

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check exhibit data
        run: python -m unittest discover -s tests -p 'test_*.py' -v
      - name: Check generated artifacts match source
        run: |
          python build_curation.py
          git diff --exit-code -- curation.html CANDIDATES.md
      - name: Install browser test requirements
        run: |
          python -m pip install playwright==1.56.0
          python -m playwright install --with-deps chromium
      - name: Check interactive flows (isolated DOM)
        run: python tests/smoke.py
      - name: Check actual local HTTP navigation and persistence
        run: python tests/site_smoke.py

  publish:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: verify
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    outputs:
      page_url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      contents: read
      pages: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - name: Prepare published assets
        run: |
          mkdir _site
          cp index.html curation.html .nojekyll _site/
          printf '%s\n' "$GITHUB_SHA" > _site/version.txt
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4

  validate-live:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: publish
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install browser test requirements
        run: |
          python -m pip install playwright==1.56.0
          python -m playwright install --with-deps chromium
      - name: Validate deployed Pages URL and commit SHA
        env:
          MUSEUM_SITE_URL: ${{ needs.publish.outputs.page_url }}
          EXPECTED_SHA: ${{ github.sha }}
        run: |
          test -n "$MUSEUM_SITE_URL"
          python tests/site_smoke.py
